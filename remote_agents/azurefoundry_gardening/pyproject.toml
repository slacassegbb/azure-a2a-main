[project]
name = "aifoundry-gardening-agent"
version = "0.1.0"
description = "An AI-powered home gardening assistant that monitors your garden via IoT camera, analyzes plant health with vision AI, and provides expert gardening advice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.2.6",
    "openai>=1.0.0",
    "azure-identity>=1.23.0",
    "azure-storage-blob>=12.19.0",
    "uvicorn>=0.34.2",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.35.0",
    "httpx>=0.25.0",
    "gradio>=4.0.0",
    "pandas>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pyvesync>=3.4.0",
]
